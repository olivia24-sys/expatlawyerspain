<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spanish Property Transfer Tax (ITP) Calculator | ExpatLawyerSpain</title>
<link rel="stylesheet" href="/widgets/v1/widget.css">
<link rel="stylesheet" href="/widgets/v1/itp-calculator.css">
<script defer src="/widgets/v1/itp-calculator-data.js"></script>
<script defer src="/js/calc-engine.js"></script>
<script defer src="/widgets/v1/itp-calculator.js"></script>
</head>
<body>
<h1 class="itp-title">Spanish property tax (ITP) calculator</h1>
<form id="itp-form" class="itp-form" novalidate>
  <div class="itp-field">
    <label for="itp-region">Where is the property?</label>
    <select id="itp-region" required>
      <option value="">Choose a region</option>
    </select>
  </div>
  <fieldset class="itp-field itp-type">
    <legend>What are you buying?</legend>
    <label><input type="radio" name="itp-type" value="resale" checked> Resale</label>
    <label><input type="radio" name="itp-type" value="new-build"> New build</label>
  </fieldset>
  <div class="itp-field">
    <label for="itp-price">Declared purchase price (€)</label>
    <input id="itp-price" type="text" inputmode="decimal" placeholder="350,000" required>
  </div>
  <button type="submit">Calculate the tax</button>
</form>
<div id="itp-result" class="itp-result" hidden aria-live="polite"></div>
<div id="itp-refine" class="itp-refine" hidden></div>
<div id="itp-secondary-cta" class="itp-secondary-cta" hidden></div>
<!-- No in-frame footer/attribution: the single "Powered by ExpatLawyerSpain"
     link is injected by the loader (embed/v1.js) into the HOST page's own DOM,
     where it is a crawlable backlink. An in-frame link would sit inside a
     noindex sandboxed iframe and is not crawlable, so it is not repeated here. -->
</body>
</html>
